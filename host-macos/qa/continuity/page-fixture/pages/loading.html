<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-os fixture · Loading</title>
<link rel="stylesheet" href="/fixture.css">
<script src="/fixture.js" defer></script>
</head>
<body data-page="loading" data-slow-load>
<main>
<h1>Slow loading fixture</h1>
<p class="note">Harmless loopback page for pi-os continuity QA. What you type never leaves this page; it only shows how many characters arrived.</p>
<p class="note">The search box has autofocus, but the page keeps loading for <code>?ms=</code> milliseconds (default 1500, at most 10000).</p>
<form role="search">
<label for="search">Search fixture</label>
<input id="search" type="search" name="q" autofocus autocomplete="off" placeholder="Search fixture" data-field="search">
<output data-echo="search"></output>
</form>
<output data-echo-page></output>
</main>
</body>
</html>
