<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-os fixture · Combobox</title>
<link rel="stylesheet" href="/fixture.css">
<script src="/fixture.js" defer></script>
</head>
<body data-page="combobox">
<main>
<h1>Combobox search fixture</h1>
<p class="note">Harmless loopback page for pi-os continuity QA. What you type never leaves this page; it only shows how many characters arrived.</p>
<form role="search">
<textarea id="q" name="q" rows="1" role="combobox" aria-label="Search" aria-autocomplete="both" aria-expanded="false" autofocus autocomplete="off" spellcheck="false" data-field="q" data-enter-submits="true"></textarea>
<output data-echo="q"></output>
</form>
<output data-echo-page></output>
</main>
</body>
</html>
