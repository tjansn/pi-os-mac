name: Native conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    # The host needs swift-tools-version 6.1 (FluidAudio) and the macOS 26 SDK (SpeechAnalyzer, glass), which
    # macos-14 lacks. macos-26 is the newest GA image; the Xcode 27 (macOS 27 SDK) image is still a preview.
    # Code that needs the macOS 27 SDK is behind `#if compiler(>=6.4)` (Swift 6.4 = Xcode 27), so it builds here.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PI_OFFLINE: "1"
      PI_OS_AGENT: "0"
      # Shared hosted runners are slower and noisier than a developer Mac: widen the latency gates
      # (instantPerf.test.ts convention) without changing their local thresholds.
      PI_OS_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 (Swift 6.3, macOS 26.5 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node-harness/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: node-harness
      - run: npm run check && npm test && npm run build
        working-directory: node-harness
      - run: swift test --jobs 2 --package-path host-macos --skip PresentationTests/testLastAnswerSurvivesDismissalNewPromptAndError
      - run: npm run test:macos
        working-directory: node-harness
      - run: swift build --jobs 2 --package-path host-macos -c release --product pi-os
      - run: for f in host-macos/scripts/*.sh; do bash -n "$f" || exit 1; done
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PI_OFFLINE: "1"
      PI_OS_AGENT: "0"
      PI_OS_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node-harness/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts
        working-directory: node-harness
      - run: npm run check
        working-directory: node-harness
      - run: npm test
        working-directory: node-harness
      - run: npm run build
        working-directory: node-harness
      - run: dotnet test host-dotnet/WindowsHarness.Host.Tests/WindowsHarness.Host.Tests.csproj --configuration Release
